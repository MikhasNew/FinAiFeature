    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>

        function scrollToTop() {
            document.documentElement.scrollTop = 3000;
            document.documentElement.scrollTop = 0;
        }

        // Добавленная функция для вычисления доступной высоты (для таблицы с виртуализацией)
        window.getAvailableHeight = function (selector) {
            var container = document.querySelector(selector);
            if (container) {
                return container.clientHeight;  // Или window.innerHeight - appbar.offsetHeight - tabs.offsetHeight
            }
            return 500;
        };
        window.setupResizeListener = function (dotnetHelper) {
            window.addEventListener('resize', function () {
                dotnetHelper.invokeMethodAsync('OnWindowResize');  // Вызываем метод Blazor
            });
        };
        // Функция для удаления resize listener
        window.removeResizeListener = function () {
            if (resizeListener) {
                window.removeEventListener('resize', resizeListener);
                resizeListener = null;  // Очищаем переменную
            }
        };

    </script>
